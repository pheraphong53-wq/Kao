<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bemo🤖🛠️ เครื่องคิดเลข</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #dff7ff, #f5e8ff);
}

.calculator {
  width: 340px;
  padding: 20px;
  border-radius: 25px;
  background: white;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

h1 {
  text-align: center;
  margin: 0 0 15px;
  font-size: 25px;
}

#display {
  width: 100%;
  height: 75px;
  border: none;
  border-radius: 15px;
  background: #f1f3f6;
  text-align: right;
  padding: 10px 15px;
  font-size: 32px;
  margin-bottom: 15px;
  outline: none;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 60px;
  border: none;
  border-radius: 15px;
  font-size: 21px;
  cursor: pointer;
  background: #eef1f5;
}

button:active {
  transform: scale(0.95);
}

.operator {
  background: #b9e8ff;
}

.equal {
  background: #8ee6b5;
  grid-column: span 2;
}

.clear {
  background: #ffb3b3;
}

.zero {
  grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">

  <h1>Bemo🤖🛠️</h1>

  <input id="display" type="text" value="0" readonly>

  <div class="buttons">

    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="deleteNumber()">⌫</button>
    <button class="operator" onclick="add('/')">÷</button>
    <button class="operator" onclick="add('*')">×</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="operator" onclick="add('-')">−</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="operator" onclick="add('+')">+</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="calculate()">=</button>

    <button class="zero" onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>

  </div>
</div>

<script>

let display = document.getElementById("display");

function add(value) {

  if (display.value === "0") {
    display.value = value;
  } else {
    display.value += value;
  }

}

function clearDisplay() {
  display.value = "0";
}

function deleteNumber() {

  if (display.value.length <= 1) {
    display.value = "0";
  } else {
    display.value = display.value.slice(0, -1);
  }

}

function calculate() {

  try {

    let expression = display.value;

    if (!/^[0-9+\-*/.]+$/.test(expression)) {
      display.value = "Error";
      return;
    }

    let result = Function('"use strict"; return (' + expression + ')')();

    display.value = result;

  } catch {
    display.value = "Error";
  }

}

</script>

</body>
</html>
