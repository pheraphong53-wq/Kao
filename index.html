<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bemo Checkers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#2c1810,#4a2c1a);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Segoe UI',sans-serif;color:#f5e6c8;overflow:hidden;touch-action:none;
}
h1{font-size:1.6rem;margin-bottom:6px;text-shadow:2px 2px 4px #000;letter-spacing:1px}
.subtitle{font-size:.85rem;opacity:.7;margin-bottom:12px}
#board{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(92vw,420px);height:min(92vw,420px);
  border:6px solid #5c3a1e;border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 20px rgba(0,0,0,.3);
  background:#3d2314;
}
.cell{
  display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;
}
.cell.dark{background:#5c3a1e}
.cell.light{background:#d4a574}
.cell.highlight{background:#6b8e23 !important;box-shadow:inset 0 0 12px #9acd32}
.cell.possible{background:#2e8b57 !important}
.cell.possible::after{
  content:'';width:18px;height:18px;border-radius:50%;
  background:rgba(255,255,255,.35);position:absolute;
}
.piece{
  width:78%;height:78%;border-radius:50%;
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;font-weight:bold;user-select:none;
  transition:transform .15s;
}
.piece.red{background:radial-gradient(circle at 30% 30%,#ff6b6b,#c0392b);color:#fff}
.piece.black{background:radial-gradient(circle at 30% 30%,#5d6d7e,#1c2833);color:#eee}
.piece.king::after{content:'♚';font-size:1.3rem}
.piece.selected{transform:scale(1.12);box-shadow:0 0 12px #ffd700,0 3px 6px rgba(0,0,0,.5)}

#info{
  margin-top:14px;font-size:1rem;text-align:center;
  background:rgba(0,0,0,.35);padding:8px 18px;border-radius:20px;
}
#status{font-weight:bold;color:#ffd700}
.creator{
  position:fixed;top:8px;right:12px;
  font-size:.7rem;opacity:.35;color:#f5e6c8;
  pointer-events:none;letter-spacing:.5px;
}
#controls{margin-top:12px;display:flex;gap:10px}
button{
  padding:8px 18px;border:none;border-radius:20px;font-size:.9rem;
  background:#8b5a2b;color:#fff;cursor:pointer;box-shadow:0 3px 0 #5c3a1e;
}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #5c3a1e}
</style>
</head>
<body>
<div class="creator">ผู้สร้าง: พีรพงษ์ เพิ่มพิพัฒน์</div>
<h1>Bemo หมากฮอต</h1>
<div class="subtitle">สู้กับ Bemo AI</div>
<div id="board"></div>
<div id="info">
  <span id="status">ตาคุณ (แดง)</span>
</div>
<div id="controls">
  <button onclick="resetGame()">เริ่มใหม่</button>
</div>

<script>
const SIZE = 8;
let board = [];
let selected = null;
let possibleMoves = [];
let turn = 'red';
let gameOver = false;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function initBoard() {
  board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < SIZE; c++) {
      if ((r + c) % 2 === 1) board[r][c] = { color: 'black', king: false };
    }
  }
  for (let r = 5; r < 8; r++) {
    for (let c = 0; c < SIZE; c++) {
      if ((r + c) % 2 === 1) board[r][c] = { color: 'red', king: false };
    }
  }
}

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      cell.dataset.r = r;
      cell.dataset.c = c;

      if (selected && selected.r === r && selected.c === c) cell.classList.add('highlight');
      if (possibleMoves.some(m => m.r === r && m.c === c)) cell.classList.add('possible');

      const p = board[r][c];
      if (p) {
        const piece = document.createElement('div');
        piece.className = 'piece ' + p.color + (p.king ? ' king' : '');
        if (selected && selected.r === r && selected.c === c) piece.classList.add('selected');
        cell.appendChild(piece);
      }
      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function onCellClick(r, c) {
  if (gameOver || turn !== 'red') return;

  const p = board[r][c];

  if (p && p.color === 'red') {
    selected = { r, c };
    possibleMoves = getMoves(r, c, true);
    const allCaptures = getAllCaptures('red');
    if (allCaptures.length > 0) {
      possibleMoves = possibleMoves.filter(m => m.capture);
      if (possibleMoves.length === 0) {
        board[r][c] = null;
        showMsg('ไม่กินตามกฎ! ถูกหักตัว');
        selected = null;
        possibleMoves = [];
        render();
        setTimeout(() => { turn = 'black'; statusEl.textContent = 'ตา Bemo...'; aiMove(); }, 800);
        return;
      }
    }
    render();
    return;
  }

  if (selected) {
    const move = possibleMoves.find(m => m.r === r && m.c === c);
    if (move) {
      doMove(selected.r, selected.c, move);
      selected = null;
      possibleMoves = [];
      render();

      if (move.capture && canContinueCapture(move.r, move.c)) {
        selected = { r: move.r, c: move.c };
        possibleMoves = getMoves(move.r, move.c, true).filter(m => m.capture);
        render();
        return;
      }

      if (checkWin()) return;
      turn = 'black';
      statusEl.textContent = 'ตา Bemo...';
      setTimeout(aiMove, 450);
    } else {
      selected = null;
      possibleMoves = [];
      render();
    }
  }
}

function getMoves(r, c, onlyCapture = false) {
  const p = board[r][c];
  if (!p) return [];
  const dirs = p.king
    ? [[-1,-1],[-1,1],[1,-1],[1,1]]
    : (p.color === 'red' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);

  const moves = [];
  for (const [dr, dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (!inBound(nr, nc)) continue;

    if (!board[nr][nc] && !onlyCapture) {
      moves.push({ r: nr, c: nc, capture: false });
    } else if (board[nr][nc] && board[nr][nc].color !== p.color) {
      const jr = nr + dr, jc = nc + dc;
      if (inBound(jr, jc) && !board[jr][jc]) {
        moves.push({ r: jr, c: jc, capture: true, capR: nr, capC: nc });
      }
    }
  }
  return moves;
}

function getAllCaptures(color) {
  const list = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] && board[r][c].color === color) {
        const caps = getMoves(r, c, true).filter(m => m.capture);
        if (caps.length) list.push({ r, c, moves: caps });
      }
    }
  }
  return list;
}

function canContinueCapture(r, c) {
  return getMoves(r, c, true).some(m => m.capture);
}

function doMove(fr, fc, move) {
  const p = board[fr][fc];
  board[move.r][move.c] = p;
  board[fr][fc] = null;
  if (move.capture) board[move.capR][move.capC] = null;

  if (p.color === 'red' && move.r === 0) p.king = true;
  if (p.color === 'black' && move.r === 7) p.king = true;
}

function inBound(r, c) {
  return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
}
  // ========== AI ==========
function aiMove() {
  if (gameOver) return;

  const allCaps = getAllCaptures('black');
  let best = null;

  if (allCaps.length > 0) {
    let maxScore = -Infinity;
    for (const item of allCaps) {
      for (const m of item.moves) {
        const score = evaluateMove(item.r, item.c, m);
        if (score > maxScore) {
          maxScore = score;
          best = { fr: item.r, fc: item.c, move: m };
        }
      }
    }
  } else {
    best = minimaxRoot(3);
  }

  if (best) {
    doMove(best.fr, best.fc, best.move);
    render();

    if (best.move.capture && canContinueCapture(best.move.r, best.move.c)) {
      setTimeout(() => continueAICapture(best.move.r, best.move.c), 400);
      return;
    }
  }

  if (checkWin()) return;
  turn = 'red';
  statusEl.textContent = 'ตาคุณ (แดง)';
}

function continueAICapture(r, c) {
  const moves = getMoves(r, c, true).filter(m => m.capture);
  if (moves.length === 0) {
    turn = 'red';
    statusEl.textContent = 'ตาคุณ (แดง)';
    return;
  }
  let best = moves[0];
  let maxS = -Infinity;
  for (const m of moves) {
    const s = evaluateMove(r, c, m);
    if (s > maxS) { maxS = s; best = m; }
  }
  doMove(r, c, best);
  render();
  if (canContinueCapture(best.r, best.c)) {
    setTimeout(() => continueAICapture(best.r, best.c), 400);
  } else {
    if (checkWin()) return;
    turn = 'red';
    statusEl.textContent = 'ตาคุณ (แดง)';
  }
}

function evaluateMove(fr, fc, move) {
  let score = move.capture ? 10 : 0;
  if (move.capture) score += 5;
  const p = board[fr][fc];
  if (p && p.king) score += 2;
  if (p && p.color === 'black' && move.r === 7) score += 8;
  return score + Math.random() * 0.5;
}

function minimaxRoot(depth) {
  let bestScore = -Infinity;
  let bestMove = null;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] && board[r][c].color === 'black') {
        const moves = getMoves(r, c, false);
        for (const m of moves) {
          const saved = JSON.parse(JSON.stringify(board));
          doMove(r, c, m);
          const score = -minimax(depth - 1, -Infinity, Infinity, false);
          board = saved;
          if (score > bestScore) {
            bestScore = score;
            bestMove = { fr: r, fc: c, move: m };
          }
        }
      }
    }
  }
  return bestMove;
}

function minimax(depth, alpha, beta, isMax) {
  if (depth === 0) return evaluateBoard();

  const color = isMax ? 'black' : 'red';
  let movesFound = false;
  let best = isMax ? -Infinity : Infinity;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] && board[r][c].color === color) {
        const moves = getMoves(r, c, false);
        for (const m of moves) {
          movesFound = true;
          const saved = JSON.parse(JSON.stringify(board));
          doMove(r, c, m);
          const score = minimax(depth - 1, alpha, beta, !isMax);
          board = saved;

          if (isMax) {
            best = Math.max(best, score);
            alpha = Math.max(alpha, best);
          } else {
            best = Math.min(best, score);
            beta = Math.min(beta, best);
          }
          if (beta <= alpha) return best;
        }
      }
    }
  }
  if (!movesFound) return isMax ? -1000 : 1000;
  return best;
}

function evaluateBoard() {
  let score = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const p = board[r][c];
      if (!p) continue;
      const val = p.king ? 5 : 3;
      const pos = (p.color === 'black' ? r : 7 - r) * 0.1;
      if (p.color === 'black') score += val + pos;
      else score -= val + pos;
    }
  }
  return score;
}

function checkWin() {
  let red = 0, black = 0;
  let redMoves = 0, blackMoves = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c]) {
        if (board[r][c].color === 'red') {
          red++;
          redMoves += getMoves(r, c).length;
        } else {
          black++;
          blackMoves += getMoves(r, c).length;
        }
      }
    }
  }
  if (red === 0 || redMoves === 0) {
    gameOver = true;
    statusEl.textContent = 'Bemo ชนะ!';
    return true;
  }
  if (black === 0 || blackMoves === 0) {
    gameOver = true;
    statusEl.textContent = 'คุณชนะ!';
    return true;
  }
  return false;
}

function showMsg(text) {
  statusEl.textContent = text;
}

function resetGame() {
  initBoard();
  selected = null;
  possibleMoves = [];
  turn = 'red';
  gameOver = false;
  statusEl.textContent = 'ตาคุณ (แดง)';
  render();
}

initBoard();
render();
</script>
</body>
</html>
