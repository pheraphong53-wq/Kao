<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Bemo ระบาด!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  overflow:hidden;background:#000;font-family:sans-serif;
  touch-action:none;overscroll-behavior:none;
  position:fixed;width:100%;height:100%;
}
#game-container{width:100vw;height:100vh;position:relative;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}

#opening{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(to bottom,#ff8c00,#ff4500,#228b22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease;
}
#opening.hide{opacity:0;pointer-events:none}
#opening-bmo{width:260px;max-width:70vw;margin-bottom:10px;border-radius:12px}
#title{
  color:#fff;font-size:2.8rem;font-weight:900;text-align:center;
  text-shadow:3px 3px 0 #000,0 0 15px #ff0;letter-spacing:2px;margin:10px 0 30px;
}
#play-btn{
  padding:16px 55px;font-size:1.6rem;font-weight:bold;color:#fff;
  background:linear-gradient(135deg,#00c853,#009624);
  border:4px solid #fff;border-radius:50px;cursor:pointer;
  box-shadow:0 6px 0 #006400,0 10px 20px rgba(0,0,0,.4);
  -webkit-tap-highlight-color:transparent;
}
#play-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #006400}

#hud{position:absolute;inset:0;pointer-events:none;z-index:50;display:none}
#crosshair{
  position:absolute;top:50%;left:50%;width:22px;height:22px;
  transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 6px #0f0
}
#ammo{
  position:absolute;bottom:25px;left:20px;color:#0f0;font-size:1.05rem;font-weight:bold;
  background:rgba(0,0,0,.55);padding:7px 12px;border-radius:8px;border:2px solid #0f0
}
#kills{
  position:absolute;top:15px;left:15px;color:#fff;font-size:1.1rem;font-weight:bold;
  background:rgba(0,0,0,.55);padding:8px 14px;border-radius:8px
}
#hp-wrap{
  position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
  width:160px;height:20px;background:rgba(0,0,0,.6);
  border:2px solid #fff;border-radius:6px;overflow:hidden
}
#hp-bar{height:100%;width:100%;background:linear-gradient(90deg,#f00,#ff0,#0f0);transition:width .25s}
#hp-text{position:absolute;width:100%;text-align:center;line-height:20px;color:#fff;font-size:.75rem;font-weight:bold}
#msg{
  position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
  color:#ff0;font-size:1.7rem;font-weight:900;text-shadow:0 0 12px #f00,2px 2px 0 #000;
  opacity:0;transition:opacity .3s;pointer-events:none;text-align:center
}
#msg.show{opacity:1}
#info{
  position:absolute;top:15px;left:50%;transform:translateX(-50%);
  color:#fff;font-size:.72rem;background:rgba(0,0,0,.45);
  padding:5px 11px;border-radius:8px;text-align:center;white-space:nowrap
}

/* ปุ่มออก มุมขวาบน */
#btnExit{
  position:absolute;top:15px;right:15px;width:52px;height:52px;border-radius:50%;
  background:rgba(0,0,0,.55);border:2px solid #fff;color:#fff;font-size:1.3rem;
  pointer-events:auto;display:none;align-items:center;justify-content:center;
  z-index:80;-webkit-tap-highlight-color:transparent;
}

/* ปุ่มยิง ด้านล่างขวา */
#btnShoot{
  position:absolute;bottom:90px;right:22px;width:76px;height:76px;border-radius:50%;
  background:rgba(255,40,40,.85);border:3px solid #fff;color:#fff;font-size:1.15rem;font-weight:bold;
  pointer-events:auto;display:none;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(255,0,0,.55);z-index:70;
  -webkit-tap-highlight-color:transparent;
}
#btnShoot:active{transform:scale(0.9)}
</style>
</head>
<body>
<div id="game-container">
  <div id="opening">
    <img id="opening-bmo" src="bmo.jpg" alt="Bemo" onerror="this.style.display='none'">
    <div id="title">BEMO<br>ระบาด!</div>
    <button id="play-btn">▶ PLAY</button>
  </div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="ammo">🔫 ∞</div>
    <div id="kills">💀 <span id="kill-count">0</span></div>
    <div id="hp-wrap"><div id="hp-bar"></div><div id="hp-text">HP 100</div></div>
    <div id="info">ครึ่งบน = หัน | ครึ่งล่าง = เดิน</div>
    <div id="msg"></div>
  </div>

  <div id="btnExit">✕</div>
  <div id="btnShoot">ยิง</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== STATE =====================
let scene, camera, renderer;
let clock = new THREE.Clock();
let player = { hp: 100, kills: 0, speed: 11 };
let enemies = [];
let particles = [];
let keys = {};
let isPlaying = false;
let isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
let lastShot = 0;
const SHOT_CD = 0.2;
const ENEMY_HP = 5;
let spawnTimer = 0;
let spawnEvery = 2.3;

let yaw = 0, pitch = 0;
let lookTouch = null;
let moveTouch = null;
let lookOrigin = {x:0, y:0};
let moveOrigin = {x:0, y:0};
let moveVec = {x:0, z:0};

// ===================== INIT =====================
function init() {
  // กัน gesture กลับหน้า / pull to refresh
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  document.body.style.overscrollBehavior = 'none';

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('game-container').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xff8c42);
  scene.fog = new THREE.FogExp2(0xff8c42, 0.013);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 1.7, 0);

  const hemi = new THREE.HemisphereLight(0xffe0b0, 0x2d6a2d, 1.0);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffaa55, 1.15);
  sun.position.set(40, 70, 25);
  scene.add(sun);

  createGround();
  createClouds();

  const loader = new THREE.TextureLoader();
  window.bmoTex = loader.load('bmo.jpg');

  setupEvents();
  animate();
}

function createGround() {
  const geo = new THREE.PlaneGeometry(700, 700, 50, 50);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setZ(i, (Math.random()-0.5)*0.4);
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ color: 0x3cb371 });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  for (let i = 0; i < 70; i++) {
    const g = new THREE.Mesh(
      new THREE.PlaneGeometry(1.8+Math.random()*2, 0.5+Math.random()*0.4),
      new THREE.MeshLambertMaterial({ color: 0x2e8b57, side: THREE.DoubleSide })
    );
    g.position.set((Math.random()-0.5)*480, 0.25, (Math.random()-0.5)*480);
    g.rotation.y = Math.random()*Math.PI;
    scene.add(g);
  }
}

function createClouds() {
  const mat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent:true, opacity:0.5 });
  for (let i = 0; i < 12; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(9+Math.random()*11, 6, 6), mat);
    c.position.set((Math.random()-0.5)*260, 32+Math.random()*30, (Math.random()-0.5)*260);
    scene.add(c);
  }
}

// ===================== ENEMY สมจริง =====================
function createEnemy() {
  const g = new THREE.Group();

  // ตัว
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8fd4b0 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.55, 0.55), bodyMat);
  body.position.y = 1.05;
  g.add(body);

  // หน้าจอ
  const faceMat = new THREE.MeshBasicMaterial({ 
    map: window.bmoTex || null, 
    color: window.bmoTex ? 0xffffff : 0xb8e0c8 
  });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.58), faceMat);
  face.position.set(0, 1.32, 0.29);
  g.add(face);

  // ปุ่มตกแต่ง
  const cross = new THREE.Mesh(new THREE.BoxGeometry(0.17,0.17,0.04), new THREE.MeshBasicMaterial({color:0xffcc00}));
  cross.position.set(-0.28, 0.82, 0.30); g.add(cross);

  const tri = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.13,0.04), new THREE.MeshBasicMaterial({color:0x44aaff}));
  tri.position.set(0.05, 0.88, 0.30); g.add(tri);

  const gBtn = new THREE.Mesh(new THREE.CircleGeometry(0.065,8), new THREE.MeshBasicMaterial({color:0x33cc55}));
  gBtn.position.set(0.28, 0.88, 0.30); g.add(gBtn);

  const rBtn = new THREE.Mesh(new THREE.CircleGeometry(0.085,8), new THREE.MeshBasicMaterial({color:0xff3333}));
  rBtn.position.set(0.18, 0.62, 0.30); g.add(rBtn);

  // ขา (เก็บ reference เพื่อเอามาแกว่ง)
  const legMat = new THREE.MeshLambertMaterial({ color: 0x5bb890 });
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.55, 0.24), legMat);
  legL.position.set(-0.28, 0.28, 0);
  g.add(legL);

  const legR = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.55, 0.24), legMat);
  legR.position.set(0.28, 0.28, 0);
  g.add(legR);

  // แขน
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.72, 0.2), legMat);
  armL.position.set(-0.68, 1.0, 0);
  g.add(armL);

  const armR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.72, 0.2), legMat);
  armR.position.set(0.68, 1.0, 0);
  g.add(armR);

  // เก็บไว้ใช้ animate
  g.userData.legL = legL;
  g.userData.legR = legR;
  g.userData.armL = armL;
  g.userData.armR = armR;
  g.userData.body = body;

  // เกิด
  const ang = Math.random() * Math.PI * 2;
  const dist = 28 + Math.random() * 32;
  g.position.set(
    camera.position.x + Math.cos(ang)*dist,
    0,
    camera.position.z + Math.sin(ang)*dist
  );

  g.userData.hp = ENEMY_HP;
  g.userData.speed = 2.5 + Math.random()*1.2;
  g.userData.flash = 0;
  g.userData.walkPhase = Math.random()*Math.PI*2; // จังหวะเดินไม่เหมือนกัน

  // เลือด
  const barBg = new THREE.Mesh(new THREE.PlaneGeometry(1.15,0.11), new THREE.MeshBasicMaterial({color:0x222}));
  barBg.position.y = 2.25; g.add(barBg);
  const bar = new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.08), new THREE.MeshBasicMaterial({color:0x00ff00}));
  bar.position.set(0, 2.25, 0.01); g.add(bar);
  g.userData.bar = bar;

  scene.add(g);
  enemies.push(g);
}
  // ===================== SHOOT =====================
function shoot() {
  if (!isPlaying) return;
  const now = clock.getElapsedTime();
  if (now - lastShot < SHOT_CD) return;
  lastShot = now;

  const flash = new THREE.PointLight(0xffaa00, 2.8, 8);
  flash.position.copy(camera.position);
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  flash.position.add(dir.multiplyScalar(1.3));
  scene.add(flash);
  setTimeout(function(){ scene.remove(flash); }, 45);

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = raycaster.intersectObjects(enemies, true);

  if (hits.length > 0) {
    let target = hits[0].object;
    while (target.parent && enemies.indexOf(target) === -1) target = target.parent;
    if (enemies.indexOf(target) !== -1) hitEnemy(target, hits[0].point);
  }
}

function hitEnemy(en, point) {
  en.userData.hp -= 1;
  en.userData.flash = 0.22;

  const ratio = en.userData.hp / ENEMY_HP;
  en.userData.bar.scale.x = Math.max(0.05, ratio);
  en.userData.bar.material.color.setHex(ratio > 0.55 ? 0x00ff00 : ratio > 0.25 ? 0xffff00 : 0xff0000);

  for (let i = 0; i < 5; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.07,4,4), new THREE.MeshBasicMaterial({color:0xcc0000}));
    p.position.copy(point);
    p.userData = {
      vel: new THREE.Vector3((Math.random()-0.5)*3.5, Math.random()*2.5+0.8, (Math.random()-0.5)*3.5),
      life: 0.5
    };
    scene.add(p);
    particles.push(p);
  }

  if (en.userData.hp <= 0) {
    scene.remove(en);
    enemies = enemies.filter(function(e){ return e !== en; });
    player.kills++;
    document.getElementById('kill-count').textContent = player.kills;
    showMsg('+1 Bemo!');
  }
}

function showMsg(t) {
  const el = document.getElementById('msg');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 700);
}

// ===================== UPDATE =====================
function update(dt) {
  if (!isPlaying) return;

  spawnTimer += dt;
  if (spawnTimer > spawnEvery && enemies.length < 15) {
    createEnemy();
    spawnTimer = 0;
    if (spawnEvery > 1.15) spawnEvery -= 0.03;
  }

  // เดิน
  let mx = moveVec.x;
  let mz = moveVec.z;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

  if (mx !== 0 || mz !== 0) {
    const len = Math.sqrt(mx*mx + mz*mz) || 1;
    mx /= len; mz /= len;
    const forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    camera.position.x += (forward.x * -mz + right.x * mx) * player.speed * dt;
    camera.position.z += (forward.z * -mz + right.z * mx) * player.speed * dt;
  }
  camera.position.y = 1.7;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // ศัตรู + อนิเมชันเดิน
  const t = clock.getElapsedTime();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dir = new THREE.Vector3().subVectors(camera.position, e.position);
    dir.y = 0;
    dir.normalize();
    e.position.addScaledVector(dir, e.userData.speed * dt);
    e.lookAt(camera.position.x, e.position.y, camera.position.z);

    // อนิเมชันขา + แขน แกว่งเหมือนคนเดิน
    e.userData.walkPhase += dt * 7.5;
    const swing = Math.sin(e.userData.walkPhase) * 0.55;
    const swing2 = Math.sin(e.userData.walkPhase + Math.PI) * 0.55;

    e.userData.legL.rotation.x = swing;
    e.userData.legR.rotation.x = swing2;
    e.userData.armL.rotation.x = swing2 * 0.7;
    e.userData.armR.rotation.x = swing * 0.7;

    // ตัวเด้งนิดหน่อย
    e.userData.body.position.y = 1.05 + Math.abs(Math.sin(e.userData.walkPhase)) * 0.04;

    if (e.userData.flash > 0) {
      e.userData.flash -= dt;
      e.userData.body.material.emissive = new THREE.Color(0xff2222);
      e.userData.body.material.emissiveIntensity = 0.6;
    } else {
      e.userData.body.material.emissiveIntensity = 0;
    }

    if (e.position.distanceTo(camera.position) < 1.65) {
      player.hp -= 11 * dt;
      updateHP();
      if (player.hp <= 0) gameOver();
    }
  }

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt;
    p.userData.vel.y -= 8 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i,1);
    }
  }
}

function updateHP() {
  const pct = Math.max(0, player.hp);
  document.getElementById('hp-bar').style.width = pct + '%';
  document.getElementById('hp-text').textContent = 'HP ' + Math.ceil(pct);
}

function gameOver() {
  isPlaying = false;
  showMsg('GAME OVER\nฆ่าได้ ' + player.kills + ' ตัว');
  setTimeout(function() {
    resetToMenu();
  }, 2200);
}

function resetToMenu() {
  player.hp = 100;
  player.kills = 0;
  document.getElementById('kill-count').textContent = '0';
  updateHP();
  enemies.forEach(function(e){ scene.remove(e); });
  enemies = [];
  moveVec = {x:0, z:0};
  document.getElementById('opening').classList.remove('hide');
  document.getElementById('opening').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('btnShoot').style.display = 'none';
  document.getElementById('btnExit').style.display = 'none';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

// ===================== EVENTS =====================
function setupEvents() {
  document.getElementById('play-btn').addEventListener('click', startGame);
  document.getElementById('play-btn').addEventListener('touchend', function(e){
    e.preventDefault(); startGame();
  }, {passive:false});

  document.addEventListener('keydown', function(e){ keys[e.code]=true; });
  document.addEventListener('keyup', function(e){ keys[e.code]=false; });

  document.addEventListener('mousedown', function(e){
    if (isPlaying && e.button===0) shoot();
  });
  document.addEventListener('mousemove', function(e){
    if (!isPlaying || isMobile) return;
    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
  });

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ปุ่มยิง
  const btnShoot = document.getElementById('btnShoot');
  btnShoot.addEventListener('touchstart', function(e){
    e.preventDefault(); e.stopPropagation(); shoot();
  }, {passive:false});

  // ปุ่มออก
  const btnExit = document.getElementById('btnExit');
  btnExit.addEventListener('touchstart', function(e){
    e.preventDefault(); e.stopPropagation();
    isPlaying = false;
    resetToMenu();
  }, {passive:false});
  btnExit.addEventListener('click', function(){
    isPlaying = false;
    resetToMenu();
  });

  document.addEventListener('touchstart', onTouchStart, {passive:false});
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd, {passive:false});
  document.addEventListener('touchcancel', onTouchEnd, {passive:false});
}

function onTouchStart(e) {
  if (!isPlaying) return;
  e.preventDefault();

  for (let i=0; i<e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    // ไม่สนใจถ้าแตะปุ่ม
    const btnS = document.getElementById('btnShoot').getBoundingClientRect();
    const btnE = document.getElementById('btnExit').getBoundingClientRect();
    if ((t.clientX>=btnS.left && t.clientX<=btnS.right && t.clientY>=btnS.top && t.clientY<=btnS.bottom) ||
        (t.clientX>=btnE.left && t.clientX<=btnE.right && t.clientY>=btnE.top && t.clientY<=btnE.bottom)) {
      continue;
    }

    const half = window.innerHeight * 0.48;
    if (t.clientY < half && lookTouch === null) {
      lookTouch = t.identifier;
      lookOrigin = {x:t.clientX, y:t.clientY};
    } else if (t.clientY >= half && moveTouch === null) {
      moveTouch = t.identifier;
      moveOrigin = {x:t.clientX, y:t.clientY};
      moveVec = {x:0, z:0};
    }
  }
}

function onTouchMove(e) {
  if (!isPlaying) return;
  e.preventDefault();

  for (let i=0; i<e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === lookTouch) {
      const dx = (t.clientX - lookOrigin.x) * 0.0045;
      const dy = (t.clientY - lookOrigin.y) * 0.0045;
      yaw -= dx;
      pitch = Math.max(-1.15, Math.min(1.15, pitch - dy));
      lookOrigin = {x:t.clientX, y:t.clientY};
    }
    if (t.identifier === moveTouch) {
      let dx = (t.clientX - moveOrigin.x) / 60;
      let dy = (t.clientY - moveOrigin.y) / 60;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len > 1) { dx/=len; dy/=len; }
      moveVec.x = dx;
      moveVec.z = dy;
    }
  }
}

function onTouchEnd(e) {
  for (let i=0; i<e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === lookTouch) lookTouch = null;
    if (t.identifier === moveTouch) {
      moveTouch = null;
      moveVec = {x:0, z:0};
    }
  }
}

function startGame() {
  const op = document.getElementById('opening');
  op.classList.add('hide');
  setTimeout(function(){
    op.style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('btnShoot').style.display = 'flex';
    document.getElementById('btnExit').style.display = 'flex';
    isPlaying = true;
    for (let i=0; i<4; i++) createEnemy();
  }, 1100);
}

window.onload = function() {
  if (typeof THREE === 'undefined') {
