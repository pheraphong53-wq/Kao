<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bemo🤖ระบาด!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1b4d3e, #0f2d23);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
            color: #fff;
            text-align: center;
        }
        #menu h1 {
            font-size: 40px;
            color: #4ade80;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        #menu p {
            color: #a3e635;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-play {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
        }
        .btn-play:active {
            transform: scale(0.95);
            background-color: #16a34a;
        }
        canvas {
            display: block;
        }
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .touch-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: auto;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 5px;
        }
        .ctrl-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ctrl-btn:active { background: rgba(255, 255, 255, 0.4); }
        .btn-fire {
            width: 80px;
            height: 80px;
            background: #ef4444;
            border: 2px solid #fecaca;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            cursor: pointer;
            pointer-events: auto;
        }
        .btn-fire:active { transform: scale(0.9); background: #dc2626; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Bemo🤖ระบาด!</h1>
        <p>กำจัดฝูงปีศาจ Bemo ทุ่งหญ้ากว้างใหญ่!</p>
        <button class="btn-play" onclick="startGame()">PLAY</button>
    </div>

    <div id="gameUI">
        <div id="crosshair"></div>
        <div id="hud">
            <div>🎯 คะแนน: <span id="score">0</span></div>
            <div>🔫 กระสุน: ไม่จำกัด (∞)</div>
        </div>
        
        <div class="touch-controls">
            <div class="d-pad">
                <div></div>
                <div class="ctrl-btn" ontouchstart="movePlayer('W')" onmousedown="movePlayer('W')">⬆️</div>
                <div></div>
                <div class="ctrl-btn" ontouchstart="movePlayer('A')" onmousedown="movePlayer('A')">⬅️</div>
                <div class="ctrl-btn" ontouchstart="movePlayer('S')" onmousedown="movePlayer('S')">⬇️</div>
                <div class="ctrl-btn" ontouchstart="movePlayer('D')" onmousedown="movePlayer('D')">➡️</div>
            </div>
            <button class="btn-fire" onclick="shootGun()">💥 ยิง!</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameActive = false;
        let score = 0;
        let playerX = 0, playerZ = 0, playerAngle = 0;
        let monsters = [];

        function startGame() {
            const menu = document.getElementById('menu');
            menu.style.opacity = '0';
            setTimeout(() => {
                menu.style.display = 'none';
                document.getElementById('gameUI').style.display = 'block';
                gameActive = true;
                initMonsters();
                loop();
            }, 800);
        }

        function initMonsters() {
            monsters = [];
            for (let i = 0; i < 5; i++) {
                spawnMonster();
            }
        }

        function spawnMonster() {
            let angle = Math.random() * Math.PI * 2;
            let dist = 400 + Math.random() * 300;
            monsters.push({
                x: playerX + Math.cos(angle) * dist,
                z: playerZ + Math.sin(angle) * dist,
                health: 5, // 5 นัดตาย
                maxHealth: 5,
                speed: 1.2 + Math.random() * 0.8
            });
        }

        function movePlayer(dir) {
            if (!gameActive) return;
            const step = 20;
            if (dir === 'W') {
                playerX -= Math.sin(playerAngle) * step;
                playerZ -= Math.cos(playerAngle) * step;
            } else if (dir === 'S') {
                playerX += Math.sin(playerAngle) * step;
                playerZ += Math.cos(playerAngle) * step;
            } else if (dir === 'A') {
                playerAngle -= 0.15;
            } else if (dir === 'D') {
                playerAngle += 0.15;
            }
        }

        function shootGun() {
            if (!gameActive) return;
            
            // เช็คยิงตัวที่อยู่ตรงกลางจอและใกล้ที่สุด
            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let dx = m.x - playerX;
                let dz = m.z - playerZ;
                let dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist < 500) {
                    m.health -= 1;
                    if (m.health <= 0) {
                        monsters.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                        setTimeout(spawnMonster, 1000);
                    }
                    break;
                }
            }
        }

        function loop() {
            if (!gameActive) return;

            // วาดฉากหลังท้องฟ้าและพื้นหญ้า (สียามเย็น)
            ctx.fillStyle = '#f6ad55';
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            ctx.fillStyle = '#2e8b57';
            ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

            // อัปเดตและวาด Bemo ศัตรู
            monsters.forEach(m => {
                // ขยับเข้าหาผู้เล่น
                let dx = playerX - m.x;
                let dz = playerZ - m.z;
                let dist = Math.sqrt(dx*dx + dz*dz);
                if (dist > 30) {
                    m.x += (dx / dist) * m.speed;
                    m.z += (dz / dist) * m.speed;
                }

                // คำนวณตำแหน่งแสดงผลบนจอ 2D ให้เหมือน 3D
                let screenX = canvas.width / 2 + (m.x - playerX) * 2;
                let screenY = canvas.height / 2 + 50 - (dist * 0.2);
                let size = Math.max(20, 3000 / dist);

                if (dist < 800) {
                    // วาดตัว Bemo สีเขียวตามเรฟ
                    ctx.fillStyle = '#86efac';
                    ctx.fillRect(screenX - size/2, screenY - size, size, size * 1.5);
                    // หน้าจอ Bemo สีฟ้า
                    ctx.fillStyle = '#0ea5e9';
                    ctx.fillRect(screenX - size/3, screenY - size * 0.8, size * 0.65, size * 0.6);

                    // หลอดเลือด (แสดงเลือดตามจำนวนนัดที่เหลือ 5 นัด)
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(screenX - size/2, screenY - size - 15, size, 8);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(screenX - size/2, screenY - size - 15, size * (m.health / m.maxHealth), 8);
                }
            });

            requestAnimationFrame(loop);
        }
    </script>
</body>
    </html>
