<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bemo ระบาด!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #game-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; }

    /* Opening Scene */
    #opening {
      position: absolute; inset: 0; z-index: 100;
      background: linear-gradient(to bottom, #ff8c00, #ff4500, #228b22);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1.5s ease;
    }
    #opening.fade-out { opacity: 0; pointer-events: none; }
    #opening-bmo {
      width: 280px; height: auto;
      animation: fadeInOut 4s ease-in-out forwards;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
      70% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }
    #title {
      color: #fff; font-size: 3.5rem; font-weight: 900;
      text-shadow: 4px 4px 0 #000, 0 0 20px #ff0;
      margin-top: 20px; letter-spacing: 4px;
      opacity: 0; animation: titleIn 1s 0.5s forwards;
    }
    @keyframes titleIn {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(20px); }
    }
    #play-btn {
      margin-top: 40px; padding: 18px 60px;
      font-size: 1.8rem; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #00c853, #009624);
      border: 4px solid #fff; border-radius: 50px;
      cursor: pointer; box-shadow: 0 8px 0 #006400, 0 12px 20px rgba(0,0,0,0.4);
      transition: all 0.15s; opacity: 0;
      animation: btnIn 0.8s 3.5s forwards;
    }
    #play-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #006400, 0 16px 25px rgba(0,0,0,0.5); }
    #play-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #006400; }
    @keyframes btnIn { to { opacity: 1; } }

    /* HUD */
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 24px; height: 24px; transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      box-shadow: 0 0 8px #0f0;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
    }
    #crosshair::before { width: 2px; height: 12px; top: 6px; left: 11px; }
    #crosshair::after { width: 12px; height: 2px; top: 11px; left: 6px; }

    #ammo {
      position: absolute; bottom: 30px; right: 40px;
      color: #0f0; font-size: 1.4rem; font-weight: bold;
      text-shadow: 0 0 10px #0f0; background: rgba(0,0,0,0.5);
      padding: 10px 20px; border-radius: 10px; border: 2px solid #0f0;
    }
    #kills {
      position: absolute; top: 20px; left: 20px;
      color: #fff; font-size: 1.3rem; font-weight: bold;
      text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.55);
      padding: 12px 22px; border-radius: 12px;
    }
    #hp-bar-container {
      position: absolute; bottom: 30px; left: 40px;
      width: 220px; height: 28px; background: rgba(0,0,0,0.6);
      border: 3px solid #fff; border-radius: 8px; overflow: hidden;
    }
    #hp-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #f00, #ff0, #0f0);
      transition: width 0.3s;
    }
    #hp-text {
      position: absolute; width: 100%; text-align: center;
      line-height: 28px; color: #fff; font-weight: bold; font-size: 0.95rem;
      text-shadow: 1px 1px 2px #000;
    }
    #instructions {
      position: absolute; top: 20px; right: 20px;
      color: #fff; font-size: 0.95rem; background: rgba(0,0,0,0.55);
      padding: 12px 18px; border-radius: 10px; line-height: 1.5;
      max-width: 260px;
    }
    #message {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ff0; font-size: 2.5rem; font-weight: 900;
      text-shadow: 0 0 20px #f00, 3px 3px 0 #000;
      opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    #message.show { opacity: 1; }

    /* Mobile controls */
    #mobile-controls {
      display: none; position: absolute; inset: 0; z-index: 60; pointer-events: none;
    }
    .joy-zone {
      position: absolute; bottom: 30px; width: 140px; height: 140px;
      pointer-events: auto; touch-action: none;
    }
    #joy-left { left: 30px; }
    #joy-right { right: 30px; }
    .joy-base {
      width: 100%; height: 100%; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.4);
      position: relative;
    }
    .joy-stick {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255,255,255,0.5); position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      border: 2px solid #fff;
    }
    #shoot-btn {
      position: absolute; bottom: 180px; right: 50px;
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(255,50,50,0.7); border: 4px solid #fff;
      color: #fff; font-size: 1.4rem; font-weight: bold;
      pointer-events: auto; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(255,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Opening -->
    <div id="opening">
      <img id="opening-bmo" src="bmo.jpg" alt="Bemo">
      <div id="title">BEMO ระบาด!</div>
      <button id="play-btn">▶ PLAY</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div id="crosshair"></div>
      <div id="ammo">🔫 ∞ กระสุนไม่จำกัด</div>
      <div id="kills">💀 ฆ่าแล้ว: <span id="kill-count">0</span></div>
      <div id="hp-bar-container">
        <div id="hp-bar"></div>
        <div id="hp-text">HP 100</div>
      </div>
      <div id="instructions">
        WASD / ลูกศร = เดิน<br>
        เมาส์ = หันมอง<br>
        คลิกซ้าย = ยิง<br>
        ESC = ปลดล็อคเมาส์
      </div>
      <div id="message"></div>
    </div>

    <!-- Mobile -->
    <div id="mobile-controls">
      <div class="joy-zone" id="joy-left"><div class="joy-base"><div class="joy-stick" id="stick-left"></div></div></div>
      <div class="joy-zone" id="joy-right"><div class="joy-base"><div class="joy-stick" id="stick-right"></div></div></div>
      <div id="shoot-btn">ยิง</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // ========== STATE ==========
    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();
    let player = { hp: 100, kills: 0, speed: 12 };
    let enemies = [];
    let bullets = [];
    let keys = {};
    let isPlaying = false;
    let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let moveVec = new THREE.Vector3();
    let lookDelta = { x: 0, y: 0 };
    let grassTexture, bmoTexture;
    let lastShot = 0;
    const SHOT_COOLDOWN = 0.18;
    const ENEMY_HP = 5;
    const SPAWN_INTERVAL = 2.2;
    let spawnTimer = 0;
    let gameTime = 0;// ========== INIT ==========
    async function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xff8c42);
      scene.fog = new THREE.FogExp2(0xff8c42, 0.012);

      // Camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(0, 1.7, 0);

      // Lights
      const hemi = new THREE.HemisphereLight(0xffe0b0, 0x3a7a3a, 0.9);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffaa55, 1.2);
      sun.position.set(50, 80, 30);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.near = 10;
      sun.shadow.camera.far = 200;
      sun.shadow.camera.left = -80;
      sun.shadow.camera.right = 80;
      sun.shadow.camera.top = 80;
      sun.shadow.camera.bottom = -80;
      scene.add(sun);

      // Load textures
      const loader = new THREE.TextureLoader();
      bmoTexture = await loader.loadAsync('bmo.jpg');
      bmoTexture.colorSpace = THREE.SRGBColorSpace;

      // Grass
      createGrass();

      // Sky dome (simple gradient via large sphere)
      createSky();

      // Controls
      controls = new PointerLockControls(camera, document.body);

      // Events
      setupEvents();

      // Start loop (but wait for play)
      animate();
    }

    function createGrass() {
      // Large plane with repeating grass color + noise feel
      const geo = new THREE.PlaneGeometry(800, 800, 64, 64);
      // Slight height variation
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setZ(i, (Math.random() - 0.5) * 0.4);
      }
      geo.computeVertexNormals();

      const mat = new THREE.MeshLambertMaterial({
        color: 0x3cb371,
        flatShading: true
      });
      const ground = new THREE.Mesh(geo, mat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Extra grass patches for depth
      for (let i = 0; i < 120; i++) {
        const g = new THREE.Mesh(
          new THREE.PlaneGeometry(2 + Math.random() * 3, 0.6 + Math.random()),
          new THREE.MeshLambertMaterial({ color: 0x2e8b57, side: THREE.DoubleSide })
        );
        g.position.set(
          (Math.random() - 0.5) * 400,
          0.3,
          (Math.random() - 0.5) * 400
        );
        g.rotation.y = Math.random() * Math.PI;
        scene.add(g);
      }
    }

    function createSky() {
      // Soft clouds as simple spheres
      const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.55 });
      for (let i = 0; i < 18; i++) {
        const c = new THREE.Mesh(new THREE.SphereGeometry(8 + Math.random() * 15, 8, 8), cloudMat);
        c.position.set(
          (Math.random() - 0.5) * 300,
          40 + Math.random() * 40,
          (Math.random() - 0.5) * 300
        );
        scene.add(c);
      }
    }

    // ========== ENEMY (Bemo) ==========
    function createEnemy() {
      const group = new THREE.Group();

      // Body (box like BMO)
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0x7ec8a3 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.6, 0.55), bodyMat);
      body.position.y = 0.9;
      body.castShadow = true;
      group.add(body);

      // Screen face
      const faceGeo = new THREE.PlaneGeometry(0.75, 0.55);
      const faceMat = new THREE.MeshBasicMaterial({ map: bmoTexture, transparent: true });
      const face = new THREE.Mesh(faceGeo, faceMat);
      face.position.set(0, 1.15, 0.28);
      group.add(face);

      // Simple legs
      const legMat = new THREE.MeshLambertMaterial({ color: 0x5a9e7a });
      for (let s of [-1, 1]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, 0.25), legMat);
        leg.position.set(s * 0.3, 0.25, 0);
        group.add(leg);
      }

      // Arms
      for (let s of [-1, 1]) {
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), legMat);
        arm.position.set(s * 0.65, 0.85, 0);
        group.add(arm);
      }

      // Spawn far away around player
      const angle = Math.random() * Math.PI * 2;
      const dist = 35 + Math.random() * 40;
      group.position.set(
        camera.position.x + Math.cos(angle) * dist,
        0,
        camera.position.z + Math.sin(angle) * dist
      );

      group.userData = {
        hp: ENEMY_HP,
        speed: 2.8 + Math.random() * 1.2, // ช้าแต่ไม่ช้ามาก
        hitFlash: 0
      };

      // Health bar
      const barBg = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x333333 })
      );
      barBg.position.y = 2.1;
      group.add(barBg);

      const bar = new THREE.Mesh(
        new THREE.PlaneGeometry(1.15, 0.09),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      bar.position.y = 2.1;
      bar.position.z = 0.01;
      group.add(bar);
      group.userData.hpBar = bar;

      scene.add(group);
      enemies.push(group);
    }

    // ========== SHOOTING ==========
    function shoot() {
      if (!isPlaying) return;
      const now = clock.getElapsedTime();
      if (now - lastShot < SHOT_COOLDOWN) return;
      lastShot = now;

      // Muzzle flash light
      const flash = new THREE.PointLight(0xffaa00, 3, 8);
      flash.position.copy(camera.position);
      flash.position.add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1.5));
      scene.add(flash);
      setTimeout(() => scene.remove(flash), 50);

      // Raycast
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(enemies, true);

      if (intersects.length > 0) {
        let target = intersects[0].object;
        while (target.parent && !enemies.includes(target)) {
          target = target.parent;
        }
        if (enemies.includes(target)) {
          hitEnemy(target, intersects[0].point);
        }
      }

      // Visual bullet trail (simple line)
      const dir = camera.getWorldDirection(new THREE.Vector3());
      const start = camera.position.clone().add(dir.clone().multiplyScalar(0.5));
      const end = start.clone().add(dir.multiplyScalar(80));
      const points = [start, end];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 }));
      scene.add(line);
      setTimeout(() => scene.remove(line), 60);
    }

    function hitEnemy(enemy, point) {
      enemy.userData.hp -= 1;
      enemy.userData.hitFlash = 0.25;

      // Update HP bar
      const ratio = enemy.userData.hp / ENEMY_HP;
      enemy.userData.hpBar.scale.x = Math.max(0.01, ratio);
      enemy.userData.hpBar.material.color.setHex(ratio > 0.6 ? 0x00ff00 : ratio > 0.3 ? 0xffff00 : 0xff0000);

      // Blood particles (simple red spheres)
      for (let i = 0; i < 6; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 4, 4),
          new THREE.MeshBasicMaterial({ color: 0xcc0000 })
        );
        p.position.copy(point);
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 4,
            Math.random() * 3 + 1,
            (Math.random() - 0.5) * 4
          ),
          life: 0.6
        };
        scene.add(p);
        bullets.push(p); // reuse array for particles
      }

      if (enemy.userData.hp <= 0) {
        // Die
        scene.remove(enemy);
        enemies = enemies.filter(e => e !== enemy);
        player.kills++;
        document.getElementById('kill-count').textContent = player.kills;
        showMessage('+1 Bemo!');
      }
    }

    function showMessage(txt) {
      const el = document.getElementById('message');
      el.textContent = txt;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 800);
    }

    // ========== UPDATE ==========
    function update(dt) {
      if (!isPlaying) return;
      gameTime += dt;
      spawnTimer += dt;

      // Spawn enemies
      if (spawnTimer > SPAWN_INTERVAL && enemies.length < 18) {
        createEnemy();
        spawnTimer = 0;
        // Speed up spawn a bit over time
        if (SPAWN_INTERVAL > 1.1) SPAWN_INTERVAL -= 0.02;
      }

      // Movement
      moveVec.set(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp']) moveVec.z -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveVec.z += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveVec.x -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveVec.x += 1;

      if (isMobile) {
        // Mobile joystick handled separately
      }

      if (moveVec.length() > 0) {
        moveVec.normalize();
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        const move = new THREE.Vector3()
          .addScaledVector(forward, -moveVec.z)
          .addScaledVector(right, moveVec.x)
          .multiplyScalar(player.speed * dt);

        controls.getObject().position.add(move);
      }

      // Keep player on ground
      controls.getObject().position.y = 1.7;

      // Update enemies
      for (const e of enemies) {
        // Move toward player (slow)
        const dir = new THREE.Vector3()
          .subVectors(camera.position, e.position)
          .setY(0)
          .normalize();
        e.position.addScaledVector(dir, e.userData.speed * dt);

        // Face player
        e.lookAt(camera.position.x, e.position.y, camera.position.z);

        // Hit flash
        if (e.userData.hitFlash > 0) {
          e.userData.hitFlash -= dt;
          e.children[0].material.emissive = new THREE.Color(0xff2222);
          e.children[0].material.emissiveIntensity = 0.6;
        } else {
          e.children[0].material.emissiveIntensity = 0;
        }

        // Damage player if close
        const dist = e.position.distanceTo(camera.position);
        if (dist < 1.8) {
          player.hp -= 12 * dt;
          updateHP();
          if (player.hp <= 0) {
            gameOver();
          }
        }
      }

      // Particles
      for (let i = bullets.length - 1; i >= 0; i--) {
        const p = bullets[i];
        p.userData.life -= dt;
        p.userData.vel.y -= 9 * dt;
        p.position.addScaledVector(p.userData.vel, dt);
        if (p.userData.life <= 0) {
          scene.remove(p);
          bullets.splice(i, 1);
        }
      }
    }

    function updateHP() {
      const el = document.getElementById('hp-bar');
      const txt = document.getElementById('hp-text');
      const pct = Math.max(0, player.hp);
      el.style.width = pct + '%';
      txt.textContent = 'HP ' + Math.ceil(pct);
      if (pct < 30) el.style.background = 'linear-gradient(90deg, #f00, #f00)';
      else if (pct < 60) el.style.background = 'linear-gradient(90deg, #f00, #ff0)';
    }

    function gameOver() {
      isPlaying = false;
      controls.unlock();
      showMessage('GAME OVER - ฆ่าได้ ' + player.kills + ' ตัว');
      setTimeout(() => {
        // Reset
        player.hp = 100;
        player.kills = 0;
        document.getElementById('kill-count').textContent = '0';
        updateHP();
        enemies.forEach(e => scene.remove(e));
        enemies = [];
        document.getElementById('opening').classList.remove('fade-out');
        document.getElementById('hud').style.display = 'none';
        document.getElementById('opening').style.display = 'flex';
      }, 2500);
    }

    // ========== ANIMATE ==========
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      update(dt);
      renderer.render(scene, camera);
    }

    // ========== EVENTS ==========
    function setupEvents() {
      document.getElementById('play-btn').addEventListener('click', startGame);

      document.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'Escape') controls.unlock();
      });
      document.addEventListener('keyup', e => keys[e.code] = false);

      document.addEventListener('mousedown', e => {
        if (isPlaying && e.button === 0) {
          if (controls.isLocked) shoot();
          else controls.lock();
        }
      });

      controls.addEventListener('lock', () => {
        document.getElementById('instructions').style.opacity = '0.4';
      });
      controls.addEventListener('unlock', () => {
        document.getElementById('instructions').style.opacity = '1';
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Mobile
      if (isMobile) {
        document.getElementById('mobile-controls').style.display = 'block';
        document.getElementById('instructions').innerHTML = 'ใช้จอยซ้ายเดิน<br>จอยขวาหันมอง<br>ปุ่มยิง = ยิง';
        setupMobileControls();
      }
    }

    function startGame() {
      document.getElementById('opening').classList.add('fade-out');
      setTimeout(() => {
        document.getElementById('opening').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        isPlaying = true;
        if (!isMobile) controls.lock();
        // Initial enemies
        for (let i = 0; i < 5; i++) createEnemy();
      }, 1200);
    }

    // Simple mobile joysticks
    function setupMobileControls() {
      const leftZone = document.getElementById('joy-left');
      const rightZone = document.getElementById('joy-right');
      const stickL = document.getElementById('stick-left');
      const stickR = document.getElementById('stick-right');
      const shootBtn = document.getElementById('shoot-btn');

      let leftId = null, rightId = null;
      let leftOrigin = { x: 0, y: 0 };
      let rightOrigin = { x: 0, y: 0 };

      function handleTouch(e, isLeft) {
        e.preventDefault();
        const touches = e.changedTouches;
        for (let t of touches) {
          if (isLeft && (leftId === null || leftId === t.identifier)) {
            if (e.type === 'touchstart') {
              leftId = t.identifier;
              leftOrigin = { x: t.clientX, y: t.clientY };
            } else if (e.type === 'touchmove' && leftId === t.identifier) {
              const dx = (t.clientX - leftOrigin.x) / 50;
              const dy = (t.clientY - leftOrigin.y) / 50;
              keys['KeyW'] = dy < -0.3;
              keys['KeyS'] = dy > 0.3;
              keys['KeyA'] = dx < -0.3;
              keys['KeyD'] = dx > 0.3;
              stickL.style.transform = `translate(calc(-50% + ${Math.max(-40, Math.min(40, dx * 40))}px), calc(-50% + ${Math.max(-40, Math.min(40, dy * 40))}px))`;
            } else if (e.type === 'touchend' || e.type === 'touchcancel') {
              leftId = null;
              keys['KeyW'] = keys['KeyS'] = keys['KeyA'] = keys['KeyD'] = false;
              stickL.style.transform = 'translate(-50%, -50%)';
            }
          }
          if (!isLeft && (rightId === null || rightId === t.identifier)) {
            if (e.type === 'touchstart') {
              rightId = t.identifier;
              rightOrigin = { x: t.clientX, y: t.clientY };
            } else if (e.type === 'touchmove' && rightId === t.identifier) {
              const dx = (t.clientX - rightOrigin.x) * 0.003;
              const dy = (t.clientY - rightOrigin.y) * 0.003;
              camera.rotation.y -= dx;
              camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x - dy));
              rightOrigin = { x: t.clientX, y: t.clientY };
              stickR.style.transform = `translate(calc(-50% + ${Math.max(-40, Math.min(40, (t.clientX - rightOrigin.x) * 0.5))}px), calc(-50% + ${Math.max(-40, Math.min(40, (t.clientY - rightOrigin.y) * 0.5))}px))`;
            } else if (e.type === 'touchend' || e.type === 'touchcancel') {
              rightId = null;
              stickR.style.transform = 'translate(-50%, -50%)';
            }
          }
        }
      }

      leftZone.addEventListener('touchstart', e => handleTouch(e, true), { passive: false });
      leftZone.addEventListener('touchmove', e => handleTouch(e, true), { passive: false });
      leftZone.addEventListener('touchend', e => handleTouch(e, true), { passive: false });
      rightZone.addEventListener('touchstart', e => handleTouch(e, false), { passive: false });
      rightZone.addEventListener('touchmove', e => handleTouch(e, false), { passive: false });
      rightZone.addEventListener('touchend', e => handleTouch(e, false), { passive: false });

      shootBtn.addEventListener('touchstart', e => {
        e.preventDefault();
        shoot();
      }, { passive: false });
    }

    // Boot
    init();
  </script>
</body>
</html>
