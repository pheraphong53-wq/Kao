<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Bemo ระบาด!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:sans-serif;touch-action:none}
#game-container{width:100vw;height:100vh;position:relative}
canvas{display:block;width:100%;height:100%}

#opening{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(to bottom,#ff8c00,#ff4500,#228b22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease;
}
#opening.hide{opacity:0;pointer-events:none}
#opening-bmo{width:260px;max-width:70vw;margin-bottom:10px;border-radius:12px}
#title{
  color:#fff;font-size:2.8rem;font-weight:900;text-align:center;
  text-shadow:3px 3px 0 #000,0 0 15px #ff0;letter-spacing:2px;margin:10px 0 30px;
}
#play-btn{
  padding:16px 55px;font-size:1.6rem;font-weight:bold;color:#fff;
  background:linear-gradient(135deg,#00c853,#009624);
  border:4px solid #fff;border-radius:50px;cursor:pointer;
  box-shadow:0 6px 0 #006400,0 10px 20px rgba(0,0,0,.4);
  -webkit-tap-highlight-color:transparent;
}
#play-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #006400}

#hud{position:absolute;inset:0;pointer-events:none;z-index:50;display:none}
#crosshair{
  position:absolute;top:50%;left:50%;width:22px;height:22px;
  transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 6px #0f0
}
#ammo{
  position:absolute;bottom:25px;right:20px;color:#0f0;font-size:1.1rem;font-weight:bold;
  background:rgba(0,0,0,.55);padding:8px 14px;border-radius:8px;border:2px solid #0f0
}
#kills{
  position:absolute;top:15px;left:15px;color:#fff;font-size:1.1rem;font-weight:bold;
  background:rgba(0,0,0,.55);padding:8px 14px;border-radius:8px
}
#hp-wrap{
  position:absolute;bottom:25px;left:20px;width:180px;height:24px;
  background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:6px;overflow:hidden
}
#hp-bar{height:100%;width:100%;background:linear-gradient(90deg,#f00,#ff0,#0f0);transition:width .25s}
#hp-text{position:absolute;width:100%;text-align:center;line-height:24px;color:#fff;font-size:.85rem;font-weight:bold}
#msg{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);
  color:#ff0;font-size:1.8rem;font-weight:900;text-shadow:0 0 12px #f00,2px 2px 0 #000;
  opacity:0;transition:opacity .3s;pointer-events:none;text-align:center
}
#msg.show{opacity:1}
#info{
  position:absolute;top:15px;right:15px;color:#fff;font-size:.8rem;
  background:rgba(0,0,0,.5);padding:8px 12px;border-radius:8px;line-height:1.4;max-width:160px
}

#mobile-ui{display:none;position:absolute;inset:0;z-index:60;pointer-events:none}
.joy{
  position:absolute;bottom:30px;width:120px;height:120px;pointer-events:auto;
  touch-action:none
}
#joyL{left:20px} #joyR{right:20px}
.joy-base{
  width:100%;height:100%;border-radius:50%;
  background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45);position:relative
}
.joy-stick{
  width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:2px solid #fff
}
#btnShoot{
  position:absolute;bottom:160px;right:35px;width:80px;height:80px;border-radius:50%;
  background:rgba(255,40,40,.75);border:3px solid #fff;color:#fff;font-size:1.2rem;font-weight:bold;
  pointer-events:auto;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 15px rgba(255,0,0,.5);-webkit-tap-highlight-color:transparent
}
</style>
</head>
<body>
<div id="game-container">
  <div id="opening">
    <img id="opening-bmo" src="bmo.jpg" alt="Bemo" onerror="this.style.display='none'">
    <div id="title">BEMO<br>ระบาด!</div>
    <button id="play-btn">▶ PLAY</button>
  </div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="ammo">🔫 ∞</div>
    <div id="kills">💀 <span id="kill-count">0</span></div>
    <div id="hp-wrap"><div id="hp-bar"></div><div id="hp-text">HP 100</div></div>
    <div id="info">WASD = เดิน<br>ลากนิ้ว = หัน<br>ปุ่มแดง = ยิง</div>
    <div id="msg"></div>
  </div>

  <div id="mobile-ui">
    <div class="joy" id="joyL"><div class="joy-base"><div class="joy-stick" id="stickL"></div></div></div>
    <div class="joy" id="joyR"><div class="joy-base"><div class="joy-stick" id="stickR"></div></div></div>
    <div id="btnShoot">ยิง</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ===================== STATE =====================
let scene, camera, renderer;
let clock = new THREE.Clock();
let player = { hp: 100, kills: 0, speed: 11 };
let enemies = [];
let particles = [];
let keys = {};
let isPlaying = false;
let isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
let lastShot = 0;
const SHOT_CD = 0.2;
const ENEMY_HP = 5;
let spawnTimer = 0;
let spawnEvery = 2.3;

// สำหรับการหันกล้องบนมือถือ
let yaw = 0, pitch = 0;
let touchLook = { active: false, lx: 0, ly: 0 };

// ===================== INIT =====================
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.getElementById('game-container').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xff8c42);
  scene.fog = new THREE.FogExp2(0xff8c42, 0.014);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 1.7, 0);

  // แสง
  const hemi = new THREE.HemisphereLight(0xffe0b0, 0x2d6a2d, 0.95);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffaa55, 1.1);
  sun.position.set(40, 70, 25);
  sun.castShadow = true;
  scene.add(sun);

  createGround();
  createClouds();

  // โหลด texture BMO
  const loader = new THREE.TextureLoader();
  window.bmoTex = loader.load('bmo.jpg', function(){}, function(){}, function(){
    console.log('bmo.jpg load fail');
  });

  setupEvents();
  animate();

  // แสดง mobile UI ทันทีถ้าเป็นมือถือ
  if (isMobile) {
    document.getElementById('mobile-ui').style.display = 'block';
    document.getElementById('info').innerHTML = 'จอยซ้าย = เดิน<br>จอยขวา = หัน<br>ปุ่มแดง = ยิง';
  }
}

function createGround() {
  const geo = new THREE.PlaneGeometry(600, 600, 40, 40);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setZ(i, (Math.random() - 0.5) * 0.35);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ color: 0x3cb371 });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}

function createClouds() {
  const mat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.5 });
  for (let i = 0; i < 14; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(10 + Math.random() * 12, 7, 7), mat);
    c.position.set((Math.random()-0.5)*280, 35+Math.random()*35, (Math.random()-0.5)*280);
    scene.add(c);
  }
}

// ===================== ENEMY =====================
function createEnemy() {
  const g = new THREE.Group();

  // ตัว
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x7ec8a3 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.55, 0.5), bodyMat);
  body.position.y = 0.9;
  body.castShadow = true;
  g.add(body);

  // หน้าจอ (ใส่รูป BMO)
  const faceMat = new THREE.MeshBasicMaterial({ map: window.bmoTex || null, color: 0xa0d8b0 });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.5), faceMat);
  face.position.set(0, 1.15, 0.26);
  g.add(face);

  // ขา
  const legMat = new THREE.MeshLambertMaterial({ color: 0x5a9e7a });
  [-0.28, 0.28].forEach(function(x) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.45, 0.22), legMat);
    leg.position.set(x, 0.22, 0);
    g.add(leg);
  });

  // แขน
  [-0.6, 0.6].forEach(function(x) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.65, 0.18), legMat);
    arm.position.set(x, 0.85, 0);
    g.add(arm);
  });

  // เกิดรอบๆ ผู้เล่น
  const ang = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 35;
  g.position.set(
    camera.position.x + Math.cos(ang) * dist,
    0,
    camera.position.z + Math.sin(ang) * dist
  );

  g.userData = {
    hp: ENEMY_HP,
    speed: 2.6 + Math.random() * 1.3,
    flash: 0
  };

  // แถบเลือด
  const barBg = new THREE.Mesh(
    new THREE.PlaneGeometry(1.1, 0.1),
    new THREE.MeshBasicMaterial({ color: 0x222222 })
  );
  barBg.position.y = 2.05;
  g.add(barBg);

  const bar = new THREE.Mesh(
    new THREE.PlaneGeometry(1.05, 0.08),
    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
  );
  bar.position.y = 2.05;
  bar.position.z = 0.01;
  g.add(bar);
  g.userData.bar = bar;

  scene.add(g);
  enemies.push(g);
  }
  // ===================== SHOOT =====================
function shoot() {
  if (!isPlaying) return;
  const now = clock.getElapsedTime();
  if (now - lastShot < SHOT_CD) return;
  lastShot = now;

  // แสงวาบ
  const flash = new THREE.PointLight(0xffaa00, 2.5, 7);
  flash.position.copy(camera.position);
  const dir = new THREE.Vector3(0, 0, -1);
  dir.applyQuaternion(camera.quaternion);
  flash.position.add(dir.multiplyScalar(1.2));
  scene.add(flash);
  setTimeout(function(){ scene.remove(flash); }, 40);

  // ยิง ray
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = raycaster.intersectObjects(enemies, true);

  if (hits.length > 0) {
    let target = hits[0].object;
    while (target.parent && enemies.indexOf(target) === -1) {
      target = target.parent;
    }
    if (enemies.indexOf(target) !== -1) {
      hitEnemy(target, hits[0].point);
    }
  }
}

function hitEnemy(en, point) {
  en.userData.hp -= 1;
  en.userData.flash = 0.2;

  const ratio = en.userData.hp / ENEMY_HP;
  en.userData.bar.scale.x = Math.max(0.05, ratio);
  en.userData.bar.material.color.setHex(ratio > 0.55 ? 0x00ff00 : ratio > 0.25 ? 0xffff00 : 0xff0000);

  // เลือด
  for (let i = 0; i < 5; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xcc0000 })
    );
    p.position.copy(point);
    p.userData = {
      vel: new THREE.Vector3((Math.random()-0.5)*3.5, Math.random()*2.5+0.8, (Math.random()-0.5)*3.5),
      life: 0.5
    };
    scene.add(p);
    particles.push(p);
  }

  if (en.userData.hp <= 0) {
    scene.remove(en);
    enemies = enemies.filter(function(e){ return e !== en; });
    player.kills++;
    document.getElementById('kill-count').textContent = player.kills;
    showMsg('+1 Bemo!');
  }
}

function showMsg(t) {
  const el = document.getElementById('msg');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 700);
}

// ===================== UPDATE =====================
function update(dt) {
  if (!isPlaying) return;

  spawnTimer += dt;
  if (spawnTimer > spawnEvery && enemies.length < 16) {
    createEnemy();
    spawnTimer = 0;
    if (spawnEvery > 1.2) spawnEvery -= 0.03;
  }

  // เดิน
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

  if (mx !== 0 || mz !== 0) {
    const len = Math.sqrt(mx*mx + mz*mz);
    mx /= len; mz /= len;

    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const right = new THREE.Vector3(1, 0, 0);
    right.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

    camera.position.x += (forward.x * -mz + right.x * mx) * player.speed * dt;
    camera.position.z += (forward.z * -mz + right.z * mx) * player.speed * dt;
  }
  camera.position.y = 1.7;

  // อัปเดตการหันกล้อง
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // ศัตรู
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dir = new THREE.Vector3();
    dir.subVectors(camera.position, e.position);
    dir.y = 0;
    dir.normalize();
    e.position.addScaledVector(dir, e.userData.speed * dt);
    e.lookAt(camera.position.x, e.position.y, camera.position.z);

    if (e.userData.flash > 0) {
      e.userData.flash -= dt;
      e.children[0].material.emissive = new THREE.Color(0xff2222);
      e.children[0].material.emissiveIntensity = 0.55;
    } else {
      e.children[0].material.emissiveIntensity = 0;
    }

    if (e.position.distanceTo(camera.position) < 1.7) {
      player.hp -= 11 * dt;
      updateHP();
      if (player.hp <= 0) gameOver();
    }
  }

  // อนุภาค
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt;
    p.userData.vel.y -= 8 * dt;
    p.position.addScaledVector(p.userData.vel, dt);
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

function updateHP() {
  const pct = Math.max(0, player.hp);
  document.getElementById('hp-bar').style.width = pct + '%';
  document.getElementById('hp-text').textContent = 'HP ' + Math.ceil(pct);
}

function gameOver() {
  isPlaying = false;
  showMsg('GAME OVER\nฆ่าได้ ' + player.kills + ' ตัว');
  setTimeout(function() {
    player.hp = 100;
    player.kills = 0;
    document.getElementById('kill-count').textContent = '0';
    updateHP();
    enemies.forEach(function(e){ scene.remove(e); });
    enemies = [];
    document.getElementById('opening').classList.remove('hide');
    document.getElementById('opening').style.display = 'flex';
    document.getElementById('hud').style.display = 'none';
  }, 2200);
}

// ===================== LOOP =====================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

// ===================== EVENTS =====================
function setupEvents() {
  document.getElementById('play-btn').addEventListener('click', startGame);
  document.getElementById('play-btn').addEventListener('touchend', function(e){
    e.preventDefault();
    startGame();
  }, {passive:false});

  document.addEventListener('keydown', function(e){ keys[e.code] = true; });
  document.addEventListener('keyup', function(e){ keys[e.code] = false; });

  // คลิกยิง (เดสก์ท็อป)
  document.addEventListener('mousedown', function(e){
    if (isPlaying && e.button === 0) shoot();
  });

  // เมาส์หัน (เดสก์ท็อป)
  document.addEventListener('mousemove', function(e){
    if (!isPlaying || isMobile) return;
    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
  });

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (isMobile) setupMobile();
}

function startGame() {
  const op = document.getElementById('opening');
  op.classList.add('hide');
  setTimeout(function(){
    op.style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    isPlaying = true;
    // สร้างศัตรูเริ่มต้น
    for (let i = 0; i < 4; i++) createEnemy();
  }, 1100);
}

// ===================== MOBILE CONTROLS =====================
function setupMobile() {
  const joyL = document.getElementById('joyL');
  const joyR = document.getElementById('joyR');
  const stickL = document.getElementById('stickL');
  const stickR = document.getElementById('stickR');
  const btnShoot = document.getElementById('btnShoot');

  let leftTouch = null, rightTouch = null;
  let leftOrigin = {x:0,y:0}, rightOrigin = {x:0,y:0};

  function onTouchStart(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (joyL.contains(el) || joyL === el) {
        leftTouch = t.identifier;
        leftOrigin = {x: t.clientX, y: t.clientY};
      } else if (joyR.contains(el) || joyR === el) {
        rightTouch = t.identifier;
        rightOrigin = {x: t.clientX, y: t.clientY};
      }
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === leftTouch) {
        const dx = (t.clientX - leftOrigin.x) / 45;
        const dy = (t.clientY - leftOrigin.y) / 45;
        keys['KeyW'] = dy < -0.25;
        keys['KeyS'] = dy > 0.25;
        keys['KeyA'] = dx < -0.25;
        keys['KeyD'] = dx > 0.25;
        const cx = Math.max(-35, Math.min(35, dx * 35));
        const cy = Math.max(-35, Math.min(35, dy * 35));
        stickL.style.transform = 'translate(calc(-50% + ' + cx + 'px), calc(-50% + ' + cy + 'px))';
      }
      if (t.identifier === rightTouch) {
        const dx = (t.clientX - rightOrigin.x) * 0.004;
        const dy = (t.clientY - rightOrigin.y) * 0.004;
        yaw -= dx;
        pitch = Math.max(-1.15, Math.min(1.15, pitch - dy));
        rightOrigin = {x: t.clientX, y: t.clientY};
      }
    }
  }

  function onTouchEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === leftTouch) {
        leftTouch = null;
        keys['KeyW'] = keys['KeyS'] = keys['KeyA'] = keys['KeyD'] = false;
        stickL.style.transform = 'translate(-50%, -50%)';
      }
      if (t.identifier === rightTouch) {
        rightTouch = null;
        stickR.style.transform = 'translate(-50%, -50%)';
      }
    }
  }

  document.addEventListener('touchstart', onTouchStart, {passive:false});
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd, {passive:false});
  document.addEventListener('touchcancel', onTouchEnd, {passive:false});

  btnShoot.addEventListener('touchstart', function(e){
    e.preventDefault();
    shoot();
  }, {passive:false});
}

// เริ่ม
window.onload = function() {
  if (typeof THREE === 'undefined') {
    alert('โหลด Three.js ไม่สำเร็จ\nตรวจสอบเน็ตแล้วลองใหม่');
    return;
  }
  init();
};
</script>
</body>
</html>
