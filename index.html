<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bemo🤖ระบาด!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1b4d3e, #0f2d23);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fff;
            text-align: center;
        }
        #menu h1 {
            font-size: 36px;
            color: #4ade80;
            margin-bottom: 10px;
        }
        #menu p {
            color: #a3e635;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-play {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87ceeb, #38a169);
        }
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: auto;
        }
        .touch-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: auto;
        }
        .btn-fire {
            width: 80px;
            height: 80px;
            background: #ef4444;
            border: 2px solid #fecaca;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Bemo🤖ระบาด!</h1>
        <p>ยิงฝูง Bemo ที่บุกเข้ามา!</p>
        <button class="btn-play" onclick="startGame()">PLAY</button>
    </div>

    <div id="gameUI">
        <div id="hud">
            <div>🎯 คะแนน: <span id="score">0</span></div>
            <div>❤️ พลังชีวิต: <span id="hp">100</span></div>
        </div>
        <div class="touch-controls">
            <div></div>
            <button class="btn-fire" onclick="shootGame()">💥 ยิง!</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameStarted = false;
        let score = 0;
        let hp = 100;
        let bemolist = [];

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameUI').style.display = 'block';
            gameStarted = true;
            spawnBemo();
            loop();
        }

        function spawnBemo() {
            if (!gameStarted) return;
            bemolist.push({
                x: Math.random() * (canvas.width - 100) + 50,
                y: -50,
                size: 60,
                speed: 1.5 + Math.random() * 2
            });
            setTimeout(spawnBemo, 1500);
        }

        function shootGame() {
            if (!gameStarted || bemolist.length === 0) return;
            // ยิงตัวที่อยู่ใกล้ล่างสุดก่อน
            bemolist.sort((a, b) => b.y - a.y);
            bemolist.shift(); // กำจัด Bemo ตัวแรกสุดออก
            score += 10;
            document.getElementById('score').innerText = score;
        }

        function loop() {
            if (!gameStarted) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // วาดพื้นหลัง/ฉาก
            ctx.fillStyle = '#38a169';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // อัปเดตและวาด Bemo
            for (let i = bemolist.length - 1; i >= 0; i--) {
                let b = bemolist[i];
                b.y += b.speed;

                // วาดตัว Bemo ง่ายๆ
                ctx.fillStyle = '#86efac';
                ctx.fillRect(b.x - b.size/2, b.y, b.size, b.size * 1.2);
                ctx.fillStyle = '#0ea5e9';
                ctx.fillRect(b.x - b.size/3, b.y + 10, b.size * 0.7, b.size * 0.5);

                // ถ้าหลุดจอ ถือว่าโดนโจมตี
                if (b.y > canvas.height) {
                    bemolist.splice(i, 1);
                    hp -= 10;
                    document.getElementById('hp').innerText = hp;
                    if (hp <= 0) {
                        alert('Game Over! คะแนนของคุณ: ' + score);
                        location.reload();
                    }
                }
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
