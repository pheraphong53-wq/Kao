<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bemo🤖ระบาด!</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            user-select: none;
            touch-action: none;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1b4d3e, #0f2d23);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
            color: #fff;
            text-align: center;
        }
        #menu h1 {
            font-size: 42px;
            color: #4ade80;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        #menu p {
            color: #a3e635;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-play {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 16px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
        }
        .btn-play:active {
            transform: scale(0.95);
            background-color: #16a34a;
        }
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .touch-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            pointer-events: auto;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            gap: 6px;
        }
        .ctrl-btn {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ctrl-btn:active { background: rgba(255, 255, 255, 0.45); }
        .btn-fire {
            width: 85px;
            height: 85px;
            background: #ef4444;
            border: 3px solid #fecaca;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
            cursor: pointer;
            pointer-events: auto;
        }
        .btn-fire:active { transform: scale(0.9); background: #dc2626; }
    </style>
    <!-- โหลดไลบรารี 3D Three.js ที่เสถียร -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>Bemo🤖ระบาด!</h1>
        <p>กำจัดฝูงปีศาจ Bemo 3D ทุ่งหญ้ากว้างใหญ่!</p>
        <button class="btn-play" onclick="startGame()">PLAY</button>
    </div>

    <div id="gameUI">
        <div id="crosshair"></div>
        <div id="hud">
            <div>🎯 คะแนน: <span id="score">0</span></div>
            <div>🔫 กระสุน: ไม่จำกัด (∞)</div>
        </div>
        
        <div class="touch-controls">
            <div class="d-pad">
                <div></div>
                <div class="ctrl-btn" ontouchstart="movePlayer('W')" onmousedown="movePlayer('W')">⬆️</div>
                <div></div>
                <div class="ctrl-btn" ontouchstart="movePlayer('A')" onmousedown="movePlayer('A')">⬅️</div>
                <div class="ctrl-btn" ontouchstart="movePlayer('S')" onmousedown="movePlayer('S')">⬇️</div>
                <div class="ctrl-btn" ontouchstart="movePlayer('D')" onmousedown="movePlayer('D')">➡️</div>
            </div>
            <button class="btn-fire" onclick="shootGun()">💥 ยิง!</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let player = { x: 0, z: 0, rotY: 0 };
        let monsters = [];
        let score = 0;
        let gameActive = false;

        function startGame() {
            const menu = document.getElementById('menu');
            menu.style.opacity = '0';
            setTimeout(() => {
                menu.style.display = 'none';
                document.getElementById('gameUI').style.display = 'block';
                initGame3D();
                gameActive = true;
            }, 800);
        }

        function initGame3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf6ad55); // ท้องฟ้ายามเย็นตามเรฟ
            scene.fog = new THREE.FogExp2(0xf6ad55, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            // พื้นหญ้า 3D สุดลูกหูลูกตา
            const floorGeo = new THREE.PlaneGeometry(2000, 2000);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            for (let i = 0; i < 5; i++) {
                spawnMonster();
            }

            // ระบบหมุนจอ 3D ด้วยการใช้นิ้วปัดหน้าจอ
            let isDragging = false;
            let prevMouseX = 0;

            window.addEventListener('pointerdown', (e) => {
                if(!gameActive) return;
                isDragging = true;
                prevMouseX = e.clientX;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging || !gameActive) return;
                let deltaX = e.clientX - prevMouseX;
                player.rotY -= deltaX * 0.004;
                camera.rotation.y = player.rotY;
                prevMouseX = e.clientX;
            });

            window.addEventListener('pointerup', () => { isDragging = false; });

            animate();
        }

        function createBemoMesh() {
            const group = new THREE.Group();

            // ตัวเครื่อง Bemo 3D สีเขียวพาสเทล
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.6);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x86efac });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            group.add(body);

            // หน้าจอ Bemo สีฟ้า
            const screenGeo = new THREE.BoxGeometry(0.9, 0.9, 0.1);
            const screenMat = new THREE.MeshLambertMaterial({ color: 0x0ea5e9 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.set(0, 1.1, 0.31);
            group.add(screen);

            return group;
        }

        function spawnMonster() {
            const monsterGroup = createBemoMesh();

            let angle = Math.random() * Math.PI * 2;
            let distance = 30 + Math.random() * 20;
            monsterGroup.position.x = player.x + Math.cos(angle) * distance;
            monsterGroup.position.z = player.z + Math.sin(angle) * distance;

            scene.add(monsterGroup);

            monsters.push({
                mesh: monsterGroup,
                health: 5, // ต้องยิง 5 นัดถึงตาย
                speed: 0.03 + Math.random() * 0.015 // เดินช้าๆ แต่ไม่ช้ามาก
            });
        }

        function movePlayer(direction) {
            if (!gameActive) return;
            const speed = 0.6;
            if (direction === 'W') {
                player.x -= Math.sin(player.rotY) * speed;
                player.z -= Math.cos(player.rotY) * speed;
            } else if (direction === 'S') {
                player.x += Math.sin(player.rotY) * speed;
                player.z += Math.cos(player.rotY) * speed;
            } else if (direction === 'A') {
                player.x -= Math.cos(player.rotY) * speed;
                player.z += Math.sin(player.rotY) * speed;
            } else if (direction === 'D') {
                player.x += Math.cos(player.rotY) * speed;
                player.z -= Math.sin(player.rotY) * speed;
            }
            camera.position.x = player.x;
            camera.position.z = player.z;
        }

        function shootGun() {
            if (!gameActive) return;
            
            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let dist = camera.position.distanceTo(m.mesh.position);
                
                if (dist < 22) {
                    m.health -= 1; // ลดเลือดทีละ 1 นัด
                    
                    // เอฟเฟกต์ตัวกระพริบแดงเมื่อโดนยิง
                    m.mesh.children[0].material.color.setHex(0xef4444);
                    setTimeout(() => {
                        if(m.mesh && m.mesh.children[0]) {
                            m.mesh.children[0].material.color.setHex(0x86efac);
                        }
                    }, 120);

                    // ครบ 5 นัดตาย
                    if (m.health <= 0) {
                        scene.remove(m.mesh);
                        monsters.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                        
                        setTimeout(spawnMonster, 1200);
                    }
                    break;
                }
            }
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            monsters.forEach(m => {
                m.mesh.lookAt(camera.position.x, m.mesh.position.y, camera.position.z);
                m.mesh.translateZ(m.speed);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
