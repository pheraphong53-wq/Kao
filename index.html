<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Bemo หมากฮอต</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#2c1810,#4a2c1a);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:sans-serif;color:#f5e6c8;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
h1{font-size:1.5rem;margin-bottom:4px;text-shadow:2px 2px 4px #000}
.subtitle{font-size:.8rem;opacity:.7;margin-bottom:10px}
#board{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(94vw,400px);height:min(94vw,400px);
  border:5px solid #5c3a1e;border-radius:8px;
  box-shadow:0 8px 25px rgba(0,0,0,.55);
  background:#3d2314;position:relative;
}
.cell{
  display:flex;align-items:center;justify-content:center;position:relative;
}
.cell.dark{background:#5c3a1e}
.cell.light{background:#d4a574}
.cell.possible{background:#2e8b57 !important}
.cell.possible::after{
  content:'';width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,.4);position:absolute;
}
.piece{
  width:76%;height:76%;border-radius:50%;
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:bold;
  z-index:5;touch-action:none;
}
.piece.red{background:radial-gradient(circle at 30% 30%,#ff6b6b,#c0392b);color:#fff}
.piece.black{background:radial-gradient(circle at 30% 30%,#5d6d7e,#1c2833);color:#eee}
.piece.king::after{content:'♚';font-size:1.25rem}
.piece.dragging{opacity:.85;transform:scale(1.15);z-index:20;box-shadow:0 0 14px #ffd700}

#info{
  margin-top:12px;font-size:.95rem;text-align:center;
  background:rgba(0,0,0,.35);padding:7px 16px;border-radius:18px;
}
#status{font-weight:bold;color:#ffd700}
.creator{
  position:fixed;top:8px;right:10px;
  font-size:.68rem;opacity:.32;color:#f5e6c8;pointer-events:none;
}
#controls{margin-top:10px}
button{
  padding:8px 20px;border:none;border-radius:18px;font-size:.9rem;
  background:#8b5a2b;color:#fff;box-shadow:0 3px 0 #5c3a1e;
}
button:active{transform:translateY(2px)}
</style>
</head>
<body>
<div class="creator">ผู้สร้าง: พีรพงษ์ เพิ่มพิพัฒน์</div>
<h1>Bemo หมากฮอต</h1>
<div class="subtitle">ลากตัวหมากเพื่อเดิน • สู้กับ Bemo AI</div>
<div id="board"></div>
<div id="info"><span id="status">ตาคุณ (แดง) - ลากตัวหมาก</span></div>
<div id="controls"><button onclick="resetGame()">เริ่มใหม่</button></div>

<script>
const SIZE = 8;
let board = [];
let turn = 'red';
let gameOver = false;
let dragPiece = null;
let dragFrom = null;
let possibleMoves = [];
let ghost = null;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function initBoard() {
  board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
  // ฝั่งละ 8 ตัว
  // ดำ (Bemo) แถว 0-1
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < SIZE; c++) {
      if ((r + c) % 2 === 1) board[r][c] = { color: 'black', king: false };
    }
  }
  // แดง (ผู้เล่น) แถว 6-7
  for (let r = 6; r < 8; r++) {
    for (let c = 0; c < SIZE; c++) {
      if ((r + c) % 2 === 1) board[r][c] = { color: 'red', king: false };
    }
  }
}

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      cell.dataset.r = r;
      cell.dataset.c = c;

      if (possibleMoves.some(m => m.r === r && m.c === c)) {
        cell.classList.add('possible');
      }

      const p = board[r][c];
      if (p) {
        const piece = document.createElement('div');
        piece.className = 'piece ' + p.color + (p.king ? ' king' : '');
        piece.dataset.r = r;
        piece.dataset.c = c;
        if (p.color === 'red' && turn === 'red' && !gameOver) {
          piece.style.cursor = 'grab';
        }
        cell.appendChild(piece);
      }
      boardEl.appendChild(cell);
    }
  }
  setupDrag();
}

function setupDrag() {
  const pieces = boardEl.querySelectorAll('.piece.red');
  pieces.forEach(piece => {
    piece.addEventListener('touchstart', onDragStart, {passive:false});
    piece.addEventListener('mousedown', onDragStart);
  });
}

function onDragStart(e) {
  if (gameOver || turn !== 'red') return;
  e.preventDefault();
  e.stopPropagation();

  const piece = e.currentTarget;
  const r = +piece.dataset.r;
  const c = +piece.dataset.c;
  const p = board[r][c];
  if (!p || p.color !== 'red') return;

  // ตรวจว่ามีโอกาสกินทั้งกระดานไหม
  const allCaps = getAllCaptures('red');
  possibleMoves = getMoves(r, c);

  if (allCaps.length > 0) {
    possibleMoves = possibleMoves.filter(m => m.capture);
    if (possibleMoves.length === 0) {
      // เลือกตัวที่กินไม่ได้ทั้งที่มีโอกาสกิน → หัก
      board[r][c] = null;
      statusEl.textContent = 'ไม่กินตามกฎ! ถูกหักตัว';
      render();
      setTimeout(() => {
        turn = 'black';
        statusEl.textContent = 'ตา Bemo...';
        setTimeout(aiMove, 500);
      }, 700);
      return;
    }
  }

  dragPiece = piece;
  dragFrom = { r, c };
  piece.classList.add('dragging');

  // สร้างเงาตามนิ้ว
  ghost = piece.cloneNode(true);
  ghost.style.position = 'fixed';
  ghost.style.pointerEvents = 'none';
  ghost.style.zIndex = '100';
  ghost.style.width = piece.offsetWidth + 'px';
  ghost.style.height = piece.offsetHeight + 'px';
  ghost.classList.add('dragging');
  document.body.appendChild(ghost);

  const touch = e.touches ? e.touches[0] : e;
  moveGhost(touch.clientX, touch.clientY);

  document.addEventListener('touchmove', onDragMove, {passive:false});
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('mouseup', onDragEnd);

  render(); // โชว์ possible moves
}

function moveGhost(x, y) {
  if (!ghost) return;
  ghost.style.left = (x - ghost.offsetWidth / 2) + 'px';
  ghost.style.top = (y - ghost.offsetHeight / 2) + 'px';
}

function onDragMove(e) {
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  moveGhost(touch.clientX, touch.clientY);
}

function onDragEnd(e) {
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('mouseup', onDragEnd);

  if (ghost) {
    ghost.remove();
    ghost = null;
  }
  if (!dragPiece || !dragFrom) return;

  const touch = e.changedTouches ? e.changedTouches[0] : e;
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  let targetCell = el;
  while (targetCell && !targetCell.classList.contains('cell')) {
    targetCell = targetCell.parentElement;
  }

  if (targetCell) {
    const tr = +targetCell.dataset.r;
    const tc = +targetCell.dataset.c;
    const move = possibleMoves.find(m => m.r === tr && m.c === tc);
    if (move) {
      doMove(dragFrom.r, dragFrom.c, move);
      possibleMoves = [];
      render();

      if (move.capture && canContinueCapture(move.r, move.c)) {
        // ยังต้องกินต่อ → ให้ลากต่อได้
        statusEl.textContent = 'กินต่อได้! ลากต่อ';
        // บังคับเลือกตัวเดิม
        setTimeout(() => {
          const piece = boardEl.querySelector(`.piece.red[data-r="\( {move.r}"][data-c=" \){move.c}"]`);
          if (piece) {
            // auto highlight
            possibleMoves = getMoves(move.r, move.c).filter(m => m.capture);
            dragFrom = { r: move.r, c: move.c };
            render();
          }
        }, 100);
        dragPiece = null;
        return;
      }

      if (checkWin()) return;
      turn = 'black';
      statusEl.textContent = 'ตา Bemo...';
      setTimeout(aiMove, 500);
    }
  }

  dragPiece = null;
  dragFrom = null;
  possibleMoves = [];
  render();
}

function getMoves(r, c) {
  const p = board[r][c];
  if (!p) return [];
  const dirs = p.king
    ? [[-1,-1],[-1,1],[1,-1],[1,1]]
    : (p.color === 'red' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);

  const moves = [];
  for (const [dr, dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (!inBound(nr, nc)) continue;

    if (!board[nr][nc]) {
      moves.push({ r: nr, c: nc, capture: false });
    } else if (board[nr][nc].color !== p.color) {
      const jr = nr + dr, jc = nc + dc;
      if (inBound(jr, jc) && !board[jr][jc]) {
        moves.push({ r: jr, c: jc, capture: true, capR: nr, capC: nc });
      }
    }
  }
  return moves;
}

function getAllCaptures(color) {
  const list = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] && board[r][c].color === color) {
        const caps = getMoves(r, c).filter(m => m.capture);
        if (caps.length) list.push({ r, c, moves: caps });
      }
    }
  }
  return list;
}

function canContinueCapture(r, c) {
  return getMoves(r, c).some(m => m.capture);
}

function doMove(fr, fc, move) {
  const p = board[fr][fc];
  board[move.r][move.c] = p;
  board[fr][fc] = null;
  if (move.capture) board[move.capR][move.capC] = null;
  if (p.color === 'red' && move.r === 0) p.king = true;
  if (p.color === 'black' && move.r === 7) p.king = true;
}

function inBound(r, c) {
  return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
}
  // ========== AI ==========
function aiMove() {
  if (gameOver) return;
  const allCaps = getAllCaptures('black');
  let best = null;

  if (allCaps.length > 0) {
    let maxScore = -Infinity;
    for (const item of allCaps) {
      for (const m of item.moves) {
        const score = (m.capture ? 15 : 0) + Math.random();
        if (score > maxScore) {
          maxScore = score;
          best = { fr: item.r, fc: item.c, move: m };
        }
      }
    }
  } else {
    // เดินธรรมดา
    let candidates = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (board[r][c] && board[r][c].color === 'black') {
          const moves = getMoves(r, c);
          for (const m of moves) {
            candidates.push({ fr: r, fc: c, move: m, score: evaluateSimple(r, c, m) });
          }
        }
      }
    }
    if (candidates.length) {
      candidates.sort((a, b) => b.score - a.score);
      best = candidates[0];
    }
  }

  if (best) {
    doMove(best.fr, best.fc, best.move);
    render();
    if (best.move.capture && canContinueCapture(best.move.r, best.move.c)) {
      setTimeout(() => continueAICapture(best.move.r, best.move.c), 400);
      return;
    }
  }

  if (checkWin()) return;
  turn = 'red';
  statusEl.textContent = 'ตาคุณ (แดง) - ลากตัวหมาก';
}

function continueAICapture(r, c) {
  const moves = getMoves(r, c).filter(m => m.capture);
  if (!moves.length) {
    turn = 'red';
    statusEl.textContent = 'ตาคุณ (แดง) - ลากตัวหมาก';
    return;
  }
  const best = moves[Math.floor(Math.random() * moves.length)];
  doMove(r, c, best);
  render();
  if (canContinueCapture(best.r, best.c)) {
    setTimeout(() => continueAICapture(best.r, best.c), 400);
  } else {
    if (checkWin()) return;
    turn = 'red';
    statusEl.textContent = 'ตาคุณ (แดง) - ลากตัวหมาก';
  }
}

function evaluateSimple(fr, fc, move) {
  let s = move.capture ? 12 : 1;
  if (move.r === 7) s += 6; // ใกล้เป็นคิง
  s += Math.random() * 2;
  return s;
}

function checkWin() {
  let red = 0, black = 0, redMoves = 0, blackMoves = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c]) {
        if (board[r][c].color === 'red') {
          red++;
          redMoves += getMoves(r, c).length;
        } else {
          black++;
          blackMoves += getMoves(r, c).length;
        }
      }
    }
  }
  if (red === 0 || redMoves === 0) {
    gameOver = true;
    statusEl.textContent = 'Bemo ชนะ!';
    return true;
  }
  if (black === 0 || blackMoves === 0) {
    gameOver = true;
    statusEl.textContent = 'คุณชนะ!';
    return true;
  }
  return false;
}

function resetGame() {
  initBoard();
  turn = 'red';
  gameOver = false;
  possibleMoves = [];
  dragPiece = null;
  dragFrom = null;
  statusEl.textContent = 'ตาคุณ (แดง) - ลากตัวหมาก';
  render();
}

initBoard();
render();
</script>
</body>
</html>
